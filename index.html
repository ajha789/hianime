<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hianime Player</title>
    <link rel="stylesheet" href="./vendor/vidstack/styles/base.css" />
    <link rel="stylesheet" href="./vendor/vidstack/styles/default/theme.css" />
    <link rel="stylesheet" href="./vendor/vidstack/styles/default/layouts/video.css" />
    <link rel="stylesheet" href="/src/styles/skin.css" />
  </head>
  <body>
    <main class="demo-page">
      <h1 class="demo-title">Hianime Player</h1>
      <p class="demo-subtitle">Custom skin built on Vidstack primitives, with libass-accurate (JASSUB) fansub subtitle rendering.</p>

      <form class="hn-source-bar" data-hn-source-form>
        <input
          type="text"
          class="hn-source-input"
          data-hn-source-input
          placeholder="Paste a video URL to load (.m3u8, .txt HLS, .mpd, .mp4, .webm, or any URL with a known type below)…"
          autocomplete="off"
          spellcheck="false"
        />
        <select class="hn-source-type" data-hn-source-type aria-label="Source type">
          <option value="">Auto-detect from URL</option>
          <option value="application/x-mpegurl">HLS (.m3u8 / .txt)</option>
          <option value="application/dash+xml">DASH (.mpd)</option>
          <option value="video/mp4">MP4</option>
          <option value="video/webm">WebM</option>
        </select>
        <button type="submit" class="hn-source-load">Load</button>
      </form>

      <media-player
        class="hn-player"
        title="Sample Episode"
        src="./sample/hls/master.m3u8"
        crossorigin
        playsinline
        load="eager"
        stream-type="on-demand"
      >
        <media-provider>
        </media-provider>

        <!-- Native text tracks kept for fallback / non-ASS subs -->
        <track
          src="./sample/sample.vtt"
          kind="subtitles"
          label="English (VTT)"
          srclang="en"
        />

        <media-buffering-indicator class="hn-buffering">
          <svg class="hn-buffering-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="hn-buffering-track" cx="32" cy="32" r="24" stroke="currentColor" stroke-width="5"/>
            <circle class="hn-buffering-arc" cx="32" cy="32" r="24" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </media-buffering-indicator>

        <!--
          Vidstack picks exactly one renderer for the active subtitle track:
          LibASSTextRenderer (wired up in main.js) for .ass/.ssa tracks, or
          this native <media-captions> renderer for everything else.
        -->
        <media-captions class="hn-captions"></media-captions>

        <div class="hn-gesture-layer">
          <media-gesture class="hn-gesture" event="pointerup" action="toggle:paused"></media-gesture>
          <media-gesture class="hn-gesture" event="dblpointerup" action="toggle:fullscreen"></media-gesture>
        </div>

        <div class="hn-controls" slot="controls">
          <div class="hn-top-gradient">
            <div class="hn-rating-badge">
              <span class="hn-rating-badge-tag">U/A 16+</span>
              <span class="hn-rating-badge-text">Sexualized Imagery, Violence</span>
            </div>
          </div>

          <div class="hn-controls-spacer"></div>

          <div class="hn-controls-bottom">
            <media-time-slider class="hn-time-slider">
              <div class="hn-slider-track" slot="track"></div>
              <div class="hn-slider-track-fill hn-slider-track-fill--progress" slot="track-fill"></div>
              <div class="hn-slider-track-fill hn-slider-track-fill--buffered" slot="progress"></div>
              <div class="hn-slider-thumb" slot="thumb"></div>
              <media-slider-preview class="hn-slider-preview" no-clamp>
                <media-slider-thumbnail class="hn-preview-thumbnail"></media-slider-thumbnail>
                <div class="hn-preview-time">
                  <media-slider-value></media-slider-value>
                </div>
              </media-slider-preview>
            </media-time-slider>

            <div class="hn-controls-row">
              <media-seek-button class="hn-btn" seconds="-10" aria-label="Jump backward 10 seconds">
                <svg class="hn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.3001 0.0654297V2.40479C14.3472 2.46507 16.3314 3.1403 17.9924 4.34629C19.7345 5.61117 21.0319 7.39482 21.6985 9.44189C22.3651 11.489 22.3668 13.6949 21.7035 15.7431C21.0401 17.7912 19.7457 19.5769 18.0056 20.8445C16.2655 22.1121 14.1688 22.7967 12.0159 22.8001C9.86297 22.8035 7.76411 22.1254 6.01998 20.8633C4.27585 19.6011 2.97581 17.8193 2.30602 15.7732C1.63626 13.7272 1.63093 11.5216 2.29108 9.47236L5.14664 10.3923C4.68065 11.8388 4.6844 13.3958 5.15719 14.8401C5.62999 16.2844 6.54756 17.5422 7.77868 18.4331C9.00982 19.324 10.4915 19.8025 12.0112 19.8001C13.5308 19.7977 15.0107 19.3144 16.239 18.4196C17.4674 17.5248 18.3811 16.2642 18.8494 14.8185C19.3176 13.3727 19.3164 11.8159 18.8459 10.3709C18.3753 8.92587 17.4597 7.66671 16.2299 6.77383C15.0814 5.93989 13.7138 5.46525 12.3001 5.40625V7.73535L6.02467 3.90039L12.3001 0.0654297Z" fill="currentColor"/>
                </svg>
              </media-seek-button>

              <media-play-button class="hn-btn hn-btn--play">
                <svg class="hn-icon hn-icon--play" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 3L19 12L5 21V3Z" fill="currentColor"/>
                </svg>
                <svg class="hn-icon hn-icon--pause" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 2H10V22H4V2Z" fill="currentColor"/>
                  <path d="M14 2H20V22H14V2Z" fill="currentColor"/>
                </svg>
                <svg class="hn-icon hn-icon--replay" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z" fill="currentColor"/>
                </svg>
              </media-play-button>

              <media-seek-button class="hn-btn" seconds="10" aria-label="Jump forward 10 seconds">
                <svg class="hn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.7 0.0654297V2.40479C9.65282 2.46507 7.66859 3.1403 6.00757 4.34629C4.26546 5.61117 2.9681 7.39482 2.30151 9.44189C1.63494 11.489 1.63317 13.6949 2.29653 15.7431C2.9599 17.7912 4.25429 19.5769 5.99438 20.8445C7.73451 22.1121 9.83125 22.7967 11.9841 22.8001C14.137 22.8035 16.2359 22.1254 17.98 20.8633C19.7242 19.6011 21.0242 17.8193 21.694 15.7732C22.3638 13.7272 22.3691 11.5216 21.7089 9.47236L18.8534 10.3923C19.3194 11.8388 19.3156 13.3958 18.8428 14.8401C18.37 16.2844 17.4525 17.5422 16.2213 18.4331C14.9902 19.324 13.5085 19.8025 11.9888 19.8001C10.4692 19.7977 8.98929 19.3144 7.76099 18.4196C6.53264 17.5248 5.61889 16.2642 5.15063 14.8185C4.68241 13.3727 4.68364 11.8159 5.15415 10.3709C5.62467 8.92587 6.54032 7.66671 7.77007 6.77383C8.91866 5.93989 10.2862 5.46525 11.7 5.40625V7.73535L17.9753 3.90039L11.7 0.0654297Z" fill="currentColor"/>
                </svg>
              </media-seek-button>

              <media-mute-button class="hn-btn hn-btn--volume">
                <svg class="hn-icon hn-volume-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path class="hn-volume-mute" d="M22.2861 8.9082L19.1943 11.999L22.2861 15.0908L20.3799 16.9971L17.2881 13.9053L14.1963 16.998L12.29 15.0918L15.3818 11.999L12.29 8.90723L14.1963 7.00195L17.2881 10.0928L20.3799 7.00195L22.2861 8.9082Z" fill="none"/>
                  <path class="hn-volume-t3" d="M17.3796 5.6346L19.0107 4C19.0107 4 22.3001 7.24613 22.3 12C22.3 16.7539 18.9172 20 18.9172 20L17.3 18.3345C17.3 18.3345 20.018 15.4753 20.018 12C20.018 8.52473 17.3796 5.6346 17.3796 5.6346Z" fill="currentColor"/>
                  <path class="hn-volume-t2" d="M14.626 8.79968L16.1973 7.12695C16.1973 7.12695 18.285 9.09785 18.3 12C18.3149 14.9021 16.1973 16.9409 16.1973 16.9409L14.626 15.2936C14.626 15.2936 16.0039 14.0603 16.0039 12C16.0039 9.93965 14.626 8.79968 14.626 8.79968Z" fill="currentColor"/>
                  <path class="hn-volume-t1" d="M12 14C13.1046 14 14 13.1046 14 12C14 10.8954 13.1046 10 12 10V14Z" fill="currentColor"/>
                  <path class="hn-volume-base" d="M10.8 4.19922L4.8 7.79922H1.5V16.1992H4.8L10.8 19.7992V4.19922Z" fill="currentColor"/>
                </svg>
              </media-mute-button>
              <media-volume-slider class="hn-volume-slider">
                <div class="hn-slider-track" slot="track"></div>
                <div class="hn-slider-track-fill hn-slider-track-fill--progress" slot="track-fill"></div>
                <div class="hn-slider-thumb" slot="thumb"></div>
              </media-volume-slider>

              <div class="hn-time">
                <media-time class="hn-time-current" type="current"></media-time>
                <span class="hn-time-sep">/</span>
                <media-time class="hn-time-duration" type="duration"></media-time>
              </div>

              <media-chapter-title class="hn-chapter-title"></media-chapter-title>

              <div class="hn-controls-spacer-row"></div>

              <button type="button" class="hn-btn" aria-label="Next Episode" disabled>
                <svg class="hn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 3L18 11.3571V3H20V21H18V12.6429L5 21V3Z" fill="currentColor"/>
                </svg>
              </button>

              <media-menu class="hn-menu hn-menu--subs">
                <media-menu-button class="hn-btn hn-btn--menu" aria-label="Audio and subtitle language options">
                  <svg class="hn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 16.0003H5.9999V14.0002L14 14.0002V16.0003Z" fill="currentColor"/>
                    <path d="M17.9999 16.0003H16.0001V14.0002H17.9999V16.0003Z" fill="currentColor"/>
                    <path d="M8 12.0001L5.9999 12.0001L5.9999 10H8V12.0001Z" fill="currentColor"/>
                    <path d="M17.9999 12.0001H10.0001V10L17.9999 10V12.0001Z" fill="currentColor"/>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M22.0001 19.9999L2 19.9999L2 4L22.0001 4L22.0001 19.9999ZM4.0001 18.0001L20 18.0001L20 6.0001L4.0001 6.0001L4.0001 18.0001Z" fill="currentColor"/>
                  </svg>
                </media-menu-button>
                <media-menu-items class="hn-menu-items hn-menu-items--tracks" placement="top end" offset="30">
                  <div class="hn-track-columns">
                    <div class="hn-track-column">
                      <div class="hn-track-column-header">Audio</div>
                      <media-audio-radio-group class="hn-radio-group hn-radio-group--scroll">
                        <template>
                          <media-radio class="hn-radio hn-radio--track">
                            <span class="hn-radio-label" data-part="label"></span>
                            <svg class="hn-radio-check hn-radio-check--circle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <path fill-rule="evenodd" clip-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM15.7929 8.29289L17.2071 9.70711L10.5 16.4142L6.79289 12.7071L8.20711 11.2929L10.5 13.5858L15.7929 8.29289Z" fill="currentColor"/>
                            </svg>
                          </media-radio>
                        </template>
                      </media-audio-radio-group>
                    </div>
                    <div class="hn-track-divider"></div>
                    <div class="hn-track-column">
                      <div class="hn-track-column-header">Subtitles/CC</div>
                      <media-captions-radio-group class="hn-radio-group hn-radio-group--scroll" off-label="None">
                        <template>
                          <media-radio class="hn-radio hn-radio--track">
                            <span class="hn-radio-label" data-part="label"></span>
                            <svg class="hn-radio-check hn-radio-check--circle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <path fill-rule="evenodd" clip-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM15.7929 8.29289L17.2071 9.70711L10.5 16.4142L6.79289 12.7071L8.20711 11.2929L10.5 13.5858L15.7929 8.29289Z" fill="currentColor"/>
                            </svg>
                          </media-radio>
                        </template>
                      </media-captions-radio-group>
                    </div>
                  </div>
                </media-menu-items>
              </media-menu>

              <media-menu class="hn-menu hn-menu--speed">
                <media-menu-button class="hn-btn hn-btn--text" aria-label="Playback Speed Menu">
                  <span class="hn-speed-label" data-hn-speed-label>1x</span>
                </media-menu-button>
                <media-menu-items class="hn-menu-items" placement="top end" offset="30">
                  <media-speed-radio-group class="hn-radio-group">
                    <template>
                      <media-radio class="hn-radio">
                        <svg class="hn-radio-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <path d="M4 12.611L8.923 17.5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="hn-radio-label" data-part="label"></span>
                      </media-radio>
                    </template>
                  </media-speed-radio-group>
                </media-menu-items>
              </media-menu>

              <media-menu class="hn-menu hn-menu--settings">
                <media-menu-button class="hn-btn hn-btn--menu" aria-label="Player Settings">
                  <svg class="hn-icon hn-icon--spin-on-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M13.9035 4.22784L13.5 1L10.5 1L10.0965 4.22784C9.29386 4.42374 8.53866 4.74074 7.85138 5.15839L5.28305 3.16104L3.16173 5.28236L5.15914 7.85014C4.74112 8.53775 4.42386 9.29338 4.22784 10.0965L1 10.5L1 13.5L4.22784 13.9035C4.42384 14.7066 4.74107 15.4621 5.15904 16.1497L3.16184 18.7175L5.28312 20.8389L7.85118 18.8415C8.53851 19.2592 9.29378 19.5762 10.0965 19.7722L10.5 23L13.5 23L13.9035 19.7722C14.7064 19.5762 15.4618 19.2591 16.1492 18.8412L18.7181 20.8389L20.8394 18.7176L18.8413 16.1491C19.2591 15.4617 19.5762 14.7063 19.7722 13.9035L23 13.5L23 10.5L19.7722 10.0965C19.5763 9.29387 19.2593 8.53867 18.8416 7.8514L20.8394 5.28286L18.7181 3.16154L16.1498 5.15909C15.4622 4.7411 14.7066 4.42385 13.9035 4.22784ZM12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z" fill="currentColor"/>
                  </svg>
                </media-menu-button>
                <media-menu-items class="hn-menu-items" placement="top end" offset="30">
                  <div class="hn-settings-row hn-settings-row--boost">
                    <div class="hn-settings-row-head">
                      <span class="hn-menu-item-label">Audio Boost</span>
                      <span class="hn-settings-value" data-hn-volume-value>100%</span>
                    </div>
                    <media-volume-slider class="hn-volume-slider hn-volume-slider--settings">
                      <div class="hn-slider-track" slot="track"></div>
                      <div class="hn-slider-track-fill hn-slider-track-fill--progress" slot="track-fill"></div>
                      <div class="hn-slider-thumb" slot="thumb"></div>
                    </media-volume-slider>
                  </div>

                  <button type="button" class="hn-settings-row hn-settings-row--toggle" data-hn-autoplay-toggle aria-pressed="false">
                    <span class="hn-menu-item-label">Autoplay next episode</span>
                    <span class="hn-toggle">
                      <span class="hn-toggle-handle">
                        <svg class="hn-toggle-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <path d="M4 12.611L8.923 17.5L20 6.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                    </span>
                  </button>

                  <div class="hn-menu-divider"></div>

                  <media-menu class="hn-submenu">
                    <media-menu-button class="hn-menu-item hn-menu-item--no-icon">
                      <span class="hn-menu-item-label">Quality</span>
                      <svg class="hn-icon hn-icon--chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </media-menu-button>
                    <media-menu-items class="hn-menu-items">
                      <media-quality-radio-group class="hn-radio-group">
                        <template>
                          <media-radio class="hn-radio hn-radio--quality">
                            <svg class="hn-radio-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <path d="M4 12.611L8.923 17.5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="hn-radio-label" data-part="label"></span>
                            <span class="hn-radio-bitrate" data-part="bitrate"></span>
                          </media-radio>
                        </template>
                      </media-quality-radio-group>
                    </media-menu-items>
                  </media-menu>
                </media-menu-items>
              </media-menu>

              <media-fullscreen-button class="hn-btn">
                <svg class="hn-icon hn-icon--fs-enter" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.2929 10.2929L18.5858 4H13V2H22V11H20V5.41421L13.7071 11.7071L12.2929 10.2929Z" fill="currentColor"/>
                  <path d="M11.7071 13.7071L5.41421 20H11V22H2V13H4V18.5858L10.2929 12.2929L11.7071 13.7071Z" fill="currentColor"/>
                </svg>
                <svg class="hn-icon hn-icon--fs-exit" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M13.7071 13.7071L19.9999 20H14.4142V22H23.4142V13H21.4142V18.5858L15.1213 12.2929L13.7071 13.7071Z" fill="currentColor"/>
                  <path d="M10.2929 10.2929L4.00008 4H9.58573V2H0.585815V11H2.58573V5.41421L8.87862 11.7071L10.2929 10.2929Z" fill="currentColor"/>
                </svg>
              </media-fullscreen-button>
            </div>
          </div>
        </div>
      </media-player>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
